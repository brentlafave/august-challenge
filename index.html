<script>
const SB_URL = "https://ucjhatxzxkqfksptdsoj.supabase.co";
const SB_KEY = "sb_publishable_-b6cGqwPC4QS8OeKJa-1KA_MNr9u5xc";
const TABLE = "august_challenge";
const YEAR = 2026, MONTH = 7, NDAYS = 31;

const ICONS = {
  drop: '<path d="M12 2.7l5.66 5.66a8 8 0 1 1-11.31 0z"/>',
  ban: '<circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  steps: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
  gym: '<line x1="6.5" y1="6.5" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="17.5" y2="17.5"/><line x1="3" y1="9.5" x2="3" y2="14.5"/><line x1="21" y1="9.5" x2="21" y2="14.5"/><line x1="6.5" y1="12" x2="17.5" y2="12"/>',
  run: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
  book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',

  phones: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
  check: '<polyline points="20 6 9 17 4 12"/>'
};
function icon(name) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>'; }

const PEOPLE = [
  { key:"brent", label:"Brent", habits:[
    { key:"water",     name:"Water & non-sugar drinks", type:"bin", ic:"drop" },
    { key:"water3l",   name:"Water intake", type:"water", target:3, sub:"3 L per day", ic:"drop" },
    { key:"noalcohol", name:"No alcohol",               type:"bin", ic:"ban" },
    { key:"noubereats",name:"No Uber Eats",             type:"bin", ic:"ban" },
    { key:"sleep",     name:"Sleep",  type:"sleep", lo:6, hi:8.5, sub:"Target 6–8 hrs", ic:"moon" },
    { key:"steps",     name:"Steps",  type:"steps", target:8000, carry:true, ic:"steps" },
    { key:"weights",   name:"Weights", type:"wk", target:2, sub:"2× per week", ic:"gym", det:["min"] },
    { key:"run",       name:"Run",     type:"wk", target:1, sub:"1× per week", ic:"run", det:["km","min"] },
    { key:"audiobook", name:"Audio book", type:"bin", sub:"Listen daily", ic:"phones" }
  ]},
  { key:"leighton", label:"Leighton", habits:[
    { key:"water",   name:"Water only",   type:"bin", ic:"drop" },
    { key:"water3l", name:"Water intake", type:"water", target:3, sub:"3 L per day", ic:"drop" },
    { key:"noalcohol",name:"No alcohol",  type:"bin", ic:"ban" },
    { key:"nojunk",  name:"No junk food", type:"bin", ic:"ban" },
    { key:"sleep",   name:"Sleep",  type:"sleep", lo:6, hi:8.5, sub:"Target 6–8 hrs", ic:"moon" },
    { key:"steps",   name:"Steps",  type:"steps", target:10000, carry:true, ic:"steps" },
    { key:"gym",     name:"Gym",    type:"wk", target:3, sub:"3–4× per week", ic:"gym", det:["min"] },
    { key:"run",     name:"Run",    type:"wk", target:3, sub:"3× per week", ic:"run", det:["km","min"] },
    { key:"oats",    name:"Oat bowl", type:"bin", sub:"Every day", ic:"bowl" },
    { key:"read",    name:"Read 10 pages", type:"bin", sub:"Every day", ic:"book" }
  ]}
];
function personDef(k) { return PEOPLE.find(p => p.key === k); }

// state[person]["day|habit"] = { d: 0/1, v: number|null }
let state = {}; PEOPLE.forEach(p => state[p.key] = {});
let pending = {};   // "person|day|habit" -> {d, v}
let PERSON = "brent", selDay = null, editing = null;

const LS = "aug26c_";
try { const s = JSON.parse(localStorage.getItem(LS+"state")); if (s) PEOPLE.forEach(p => state[p.key] = s[p.key] || {}); } catch(e) {}
try { pending = JSON.parse(localStorage.getItem(LS+"pending")) || {}; } catch(e) {}
try { PERSON = localStorage.getItem(LS+"person") || "brent"; } catch(e) {}
if (!personDef(PERSON)) PERSON = "brent";

function save() { try {
  localStorage.setItem(LS+"state", JSON.stringify(state));
  localStorage.setItem(LS+"pending", JSON.stringify(pending));
  localStorage.setItem(LS+"person", PERSON);
} catch(e) {} }

function todayDay() {
  const n = new Date();
  if (n.getFullYear() === YEAR && n.getMonth() === MONTH) return n.getDate();
  if (n < new Date(YEAR, MONTH, 1)) return 0;
  return NDAYS + 1;
}
function clampDay(d) { return Math.min(Math.max(d, 1), NDAYS); }
function dow(d) { return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(YEAR, MONTH, d).getDay()]; }
function weekOf(d) { const off = (new Date(YEAR, MONTH, 1).getDay() + 6) % 7; return Math.floor((d - 1 + off) / 7); }
function weekDays(w) { const a = []; for (let d = 1; d <= NDAYS; d++) if (weekOf(d) === w) a.push(d); return a; }
function rec(p, d, h) { return state[p][d + "|" + h] || null; }
function val(p, d, h) { const r = rec(p, d, h); return r && r.v != null ? +r.v : null; }
function detOf(p, d, h) { const r = rec(p, d, h); return r && r.det ? r.det : null; }
function fmt(n) { return n.toLocaleString("en-AU"); }
function fmtDet(det) {
  const parts = [];
  if (det && det.km != null) parts.push(det.km + " km");
  if (det && det.min != null) parts.push(det.min + " min");
  return parts.join(" · ");
}

// steps carry-over: yesterday's logged shortfall (capped at one base target) adds to today
const effMemo = {};
function stepsEff(p, d, hdef) {
  const mk = p + d;
  if (effMemo[mk] != null) return effMemo[mk];
  let eff = hdef.target;
  if (d > 1) {
    const pv = val(p, d - 1, hdef.key);
    if (pv != null) {
      const prevEff = stepsEff(p, d - 1, hdef);
      eff += Math.min(hdef.target, Math.max(0, prevEff - pv));
    }
  }
  return effMemo[mk] = eff;
}
function habitDone(p, d, h) {
  const r = rec(p, d, h.key);
  if (h.type === "bin" || h.type === "wk") return !!(r && r.d);
  if (h.type === "steps") { const v = val(p, d, h.key); return v != null && v >= stepsEff(p, d, h); }
  if (h.type === "sleep") { const v = val(p, d, h.key); return v != null && v >= h.lo && v <= h.hi; }
  if (h.type === "water") { const v = val(p, d, h.key); return !!(r && r.d) || (v != null && v >= h.target); }
  return false;
}
function habitMissed(p, d, h, t) {
  // logged / elapsed but not achieved (for numeric: only when a value exists)
  if (d > Math.min(t, NDAYS) || t < 1) return false;
  if (h.type === "steps" || h.type === "sleep" || h.type === "water") { const v = val(p, d, h.key); return v != null && !habitDone(p, d, h); }
  return false;
}
function isDaily(h) { return h.type !== "wk"; }
function dayScore(p, d) { const hs = personDef(p).habits; let c = 0; for (const h of hs) if (habitDone(p, d, h)) c++; return c; }
function dayPerfect(p, d) { return personDef(p).habits.filter(isDaily).every(h => habitDone(p, d, h)); }

function monthPct(p) {
  const t = todayDay(), elapsed = t < 1 ? 0 : Math.min(t, NDAYS);
  const hs = personDef(p).habits;
  let done = 0, poss = 0;
  for (let d = 1; d <= elapsed; d++) for (const h of hs) if (isDaily(h)) { poss++; if (habitDone(p, d, h)) done++; }
  const weeks = new Set(); for (let d = 1; d <= NDAYS; d++) weeks.add(weekOf(d));
  for (const w of weeks) { const days = weekDays(w);
    if (t >= days[0]) for (const h of hs) if (h.type === "wk") {
      poss += h.target;
      done += Math.min(h.target, days.filter(d => habitDone(p, d, h)).length);
    } }
  return poss ? Math.round(done / poss * 100) : 0;
}

function setSync(msg, err) {
  document.getElementById("syncTxt").textContent = msg;
  document.getElementById("sync").className = "sync" + (err ? " err" : "");
}

async function pull() {
  try {
    const r = await fetch(SB_URL + "/rest/v1/" + TABLE + "?select=person,day,habit,done,value,detail", {
      headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } });
    if (!r.ok) throw 0;
    const rows = await r.json();
    const s = {}; PEOPLE.forEach(p => s[p.key] = {});
    for (const row of rows) if (s[row.person]) s[row.person][row.day + "|" + row.habit] = { d: row.done ? 1 : 0, v: row.value, det: row.detail || null };
    for (const key of Object.keys(pending)) {
      const [p, d, h] = key.split("|");
      if (s[p]) s[p][d + "|" + h] = pending[key];
    }
    state = s; save(); render(); setSync("synced"); flush();
  } catch (e) { setSync("offline — saved on phone", true); }
}

async function flush() {
  const keys = Object.keys(pending);
  if (!keys.length) return;
  const rows = keys.map(key => {
    const [person, day, habit] = key.split("|");
    const r = pending[key];
    return { person, day: +day, habit, done: !!r.d, value: r.v != null ? r.v : null, detail: r.det || null, updated_at: new Date().toISOString() };
  });
  try {
    const r = await fetch(SB_URL + "/rest/v1/" + TABLE + "?on_conflict=person,day,habit", {
      method: "POST",
      headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows) });
    if (!r.ok) throw 0;
    pending = {}; save(); setSync("synced");
  } catch (e) { setSync("offline — will sync later", true); }
}

function commit(d, h, obj) {
  state[PERSON][d + "|" + h.key] = obj;
  pending[PERSON + "|" + d + "|" + h.key] = obj;
  for (const k of Object.keys(effMemo)) delete effMemo[k];
  // recompute done flags for numeric records of this person (carry-over shifts targets)
  save(); render(); flush();
}
function toggle(d, h) {
  const r = rec(PERSON, d, h.key);
  commit(d, h, { d: r && r.d ? 0 : 1, v: r ? r.v : null, det: r ? r.det : null });
}
function saveNum(d, h) {
  editing = null;
  if (h.type === "wk") {
    // detail inputs: km and/or min — logging details also marks the session done
    const det = {};
    const i1 = document.getElementById("numInp"), i2 = document.getElementById("numInp2");
    if (h.det.includes("km")) { const km = parseFloat(h.det.length > 1 ? i1.value : i1.value); if (!isNaN(km)) det.km = km; }
    if (h.det.includes("min")) { const el = h.det.length > 1 ? i2 : i1; const mn = parseFloat(el.value); if (!isNaN(mn)) det.min = mn; }
    const r = rec(PERSON, d, h.key);
    commit(d, h, { d: 1, v: r ? r.v : null, det: Object.keys(det).length ? det : (r ? r.det : null) });
    return;
  }
  const inp = document.getElementById("numInp");
  const v = parseFloat(inp.value);
  if (isNaN(v)) { render(); return; }
  const r0 = rec(PERSON, d, h.key);
  const obj = { d: 0, v: v, det: r0 ? r0.det : null };
  state[PERSON][d + "|" + h.key] = obj;
  for (const k of Object.keys(effMemo)) delete effMemo[k];
  obj.d = habitDone(PERSON, d, h) ? 1 : 0;
  commit(d, h, obj);
}

function missingPrev(p) {
  const t = todayDay();
  if (t < 2) return null;
  const d = Math.min(t, NDAYS + 1) - 1;
  if (d < 1 || d > NDAYS) return null;
  const missing = personDef(p).habits.filter(h => {
    if (h.type === "steps" || h.type === "sleep") return val(p, d, h.key) == null;
    if (h.type === "water") { const r = rec(p, d, h.key); return val(p, d, h.key) == null && !(r && r.d); }
    return false;
  });
  return missing.length ? { d, missing } : null;
}
let nagDismissed = null;
try { nagDismissed = localStorage.getItem(LS + "nag"); } catch(e) {}

function addWater(d, h, litres) {
  const r = rec(PERSON, d, h.key);
  const v = Math.round(((r && r.v != null ? +r.v : 0) + litres) * 100) / 100;
  commit(d, h, { d: (r && r.d) || v >= h.target ? 1 : 0, v: v, det: r ? r.det : null });
}
function tickWater(d, h) {
  const r = rec(PERSON, d, h.key);
  const wasOver = !!(r && r.d);
  const v = r && r.v != null ? +r.v : null;
  commit(d, h, { d: wasOver ? (v != null && v >= h.target ? 1 : 0) : 1, v: v, det: r ? r.det : null });
}

function render() {
  for (const k of Object.keys(effMemo)) delete effMemo[k];
  const t = todayDay();
  const P = personDef(PERSON);

  // segmented control + other person
  const seg = document.getElementById("seg"); seg.innerHTML = "";
  for (const p of PEOPLE) {
    const b = document.createElement("button");
    b.textContent = p.label; b.className = p.key === PERSON ? "on" : "";
    b.onclick = () => { PERSON = p.key; editing = null; save(); render(); };
    seg.appendChild(b);
  }
  const other = PEOPLE.find(p => p.key !== PERSON);
  document.getElementById("other").innerHTML =
    '<div class="op">' + monthPct(other.key) + '%</div><div class="ol">' + other.label + '</div>';

  // month bar
  const pct = monthPct(PERSON);
  const elapsed = t < 1 ? 0 : Math.min(t, NDAYS);
  document.getElementById("mFill").style.width = pct + "%";
  document.getElementById("mPct").textContent = pct + "% complete";
  document.getElementById("mDay").textContent = elapsed < 1 ? "Starts 1 August" : "Day " + elapsed + " of " + NDAYS;

  // missing-data reminder for previous day
  const nagEl = document.getElementById("nag"); nagEl.innerHTML = "";
  const nag = missingPrev(PERSON);
  if (nag && nagDismissed !== PERSON + "|" + nag.d) {
    const names = nag.missing.map(h => h.name.toLowerCase()).join(" & ");
    const el = document.createElement("div");
    el.className = "nag";
    el.innerHTML = '<span class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7.5" x2="12" y2="12.5"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>' +
      '<span class="nt"><b>' + dow(nag.d) + " " + nag.d + ' August</b> — no ' + names + ' logged. Tap to enter.</span>' +
      '<span class="nx" id="nagX">&times;</span>';
    el.onclick = () => { selDay = nag.d; editing = nag.missing[0].key; render();
      setTimeout(() => { const e = document.getElementById("numInp"); if (e) e.scrollIntoView({ block: "center" }); }, 80); };
    el.querySelector("#nagX").onclick = (e) => { e.stopPropagation(); nagDismissed = PERSON + "|" + nag.d;
      try { localStorage.setItem(LS + "nag", nagDismissed); } catch(err) {} render(); };
    nagEl.appendChild(el);
  }

  // day strip
  const daysEl = document.getElementById("days"); daysEl.innerHTML = "";
  for (let d = 1; d <= NDAYS; d++) {
    const el = document.createElement("div");
    el.className = "day" + (d === selDay ? " sel" : "") + (d === t ? " today" : "") + (t >= 1 && t <= NDAYS && d > t ? " future" : "");
    const sc = dayScore(PERSON, d), tot = P.habits.length;
    el.innerHTML = '<div class="dw">' + dow(d) + '</div><div class="dn">' + d + '</div>' +
      '<div class="ring"><i style="width:' + Math.round(sc / tot * 100) + '%"></i></div>';
    el.onclick = () => { selDay = d; editing = null; render(); };
    daysEl.appendChild(el);
  }

  // selected day
  document.getElementById("selT").textContent = (selDay === t) ? "Today" : dow(selDay) + " " + selDay + " August";
  document.getElementById("selS").textContent = dayScore(PERSON, selDay) + " of " + P.habits.length + " complete";

  // habit list
  const hEl = document.getElementById("habits"); hEl.innerHTML = "";
  for (const h of P.habits) {
    const done = habitDone(PERSON, selDay, h);
    const miss = habitMissed(PERSON, selDay, h, t);
    const card = document.createElement("div");
    card.className = "habit" + (done ? " done" : miss ? " miss" : "");
    let sub = h.sub || "", right = "";
    if (h.type === "steps") {
      const eff = stepsEff(PERSON, selDay, h);
      const carry = eff - h.target;
      sub = "Target " + fmt(h.target) + (carry > 0 ? ' <span class="carry">+' + fmt(carry) + " carried</span>" : "");
      const v = val(PERSON, selDay, h.key);
      right = '<div class="val"><div class="v' + (v == null ? " empty" : "") + '">' + (v == null ? "—" : fmt(v)) + '</div><div class="u">steps</div></div>';
    } else if (h.type === "sleep") {
      const v = val(PERSON, selDay, h.key);
      right = '<div class="val"><div class="v' + (v == null ? " empty" : "") + '">' + (v == null ? "—" : v) + '</div><div class="u">hours</div></div>';
    } else if (h.type === "water") {
      const v = val(PERSON, selDay, h.key);
      const r0 = rec(PERSON, selDay, h.key);
      if (r0 && r0.d && (v == null || v < h.target)) sub = "3 L per day · ticked off";
      right = '<div class="val"><div class="v' + (v == null ? " empty" : "") + '">' + (v == null ? "—" : v) + '</div><div class="u">of 3 L</div></div>';
    } else if (h.type === "wk") {
      const w = weekOf(selDay), count = weekDays(w).filter(d => habitDone(PERSON, d, h)).length;
      const det = detOf(PERSON, selDay, h.key);
      const detTxt = det ? fmtDet(det) : "";
      sub = (h.sub || "") + " · " + count + "/" + h.target + " this week" +
        (detTxt ? ' · <span class="detlink" data-det="1">' + detTxt + '</span>' : ' · <span class="detlink" data-det="1">log details</span>');
      let pips = "";
      for (let i = 0; i < h.target; i++) pips += '<span class="pip' + (i < count ? " on" : "") + '"></span>';
      right = '<div class="pips">' + pips + '</div><div class="chk">' + (done ? icon("check") : "") + '</div>';
    } else {
      right = '<div class="chk">' + (done ? icon("check") : "") + '</div>';
    }
    card.innerHTML = '<div class="row"><div class="ic">' + icon(h.ic) + '</div>' +
      '<div class="info"><div class="nm">' + h.name + '</div>' + (sub ? '<div class="sb">' + sub + '</div>' : "") + '</div>' + right + '</div>';
    card.querySelector(".row").onclick = (ev) => {
      if (ev.target && ev.target.dataset && ev.target.dataset.det) { editing = (editing === h.key) ? null : h.key; render(); return; }
      if (h.type === "steps" || h.type === "sleep" || h.type === "water") { editing = (editing === h.key) ? null : h.key; render(); }
      else toggle(selDay, h);
    };
    if (editing === h.key) {
      const ed = document.createElement("div");
      ed.className = "editor";
      if (h.type === "water") {
        const r0 = rec(PERSON, selDay, h.key);
        const ticked = !!(r0 && r0.d && !(r0.v != null && r0.v >= h.target));
        ed.className = "editor wrapd";
        ed.innerHTML = '<button class="btn chipb" data-add="0.25">+250 ml</button>' +
          '<button class="btn chipb" data-add="0.5">+500 ml</button>' +
          '<button class="btn chipb" data-add="1">+1 L</button>' +
          '<input id="numInp" type="number" inputmode="decimal" step="50" placeholder="ml">' +
          '<button class="btn save" id="wAdd">Add</button>' +
          '<button class="btn ghost" id="wTick">' + (ticked ? "Untick" : "Tick off") + '</button>' +
          '<button class="btn ghost" id="numCancel">Close</button>';
        card.appendChild(ed);
        ed.querySelectorAll(".chipb").forEach(b => b.onclick = (e) => { e.stopPropagation(); addWater(selDay, h, parseFloat(b.dataset.add)); });
        ed.querySelector("#wAdd").onclick = (e) => { e.stopPropagation();
          const ml = parseFloat(document.getElementById("numInp").value);
          if (!isNaN(ml) && ml > 0) addWater(selDay, h, ml / 1000); };
        ed.querySelector("#wTick").onclick = (e) => { e.stopPropagation(); tickWater(selDay, h); };
        ed.querySelector("#numCancel").onclick = (e) => { e.stopPropagation(); editing = null; render(); };
        hEl.appendChild(card);
        continue;
      }
      if (h.type === "wk") {
        const det = detOf(PERSON, selDay, h.key) || {};
        let inner = "";
        if (h.det.includes("km")) inner += '<input id="numInp" type="number" inputmode="decimal" step="0.1" placeholder="km"' + (det.km != null ? ' value="' + det.km + '"' : "") + '>';
        inner += '<input id="' + (h.det.includes("km") ? "numInp2" : "numInp") + '" type="number" inputmode="decimal" step="1" placeholder="minutes"' + (det.min != null ? ' value="' + det.min + '"' : "") + '>';
        ed.innerHTML = inner + '<button class="btn ghost" id="numCancel">Cancel</button><button class="btn save" id="numSave">Save</button>';
      } else {
        const v = val(PERSON, selDay, h.key);
        const step = h.type === "sleep" ? "0.25" : "1";
        ed.innerHTML = '<input id="numInp" type="number" inputmode="decimal" step="' + step + '" placeholder="' +
          (h.type === "sleep" ? "e.g. 7.5" : "e.g. " + fmt(h.target)) + '"' + (v != null ? ' value="' + v + '"' : "") + '>' +
          '<span class="unit">' + (h.type === "sleep" ? "hours" : "steps") + '</span>' +
          '<button class="btn ghost" id="numCancel">Cancel</button><button class="btn save" id="numSave">Save</button>';
      }
      card.appendChild(ed);
      ed.querySelector("#numSave").onclick = (e) => { e.stopPropagation(); saveNum(selDay, h); };
      ed.querySelector("#numCancel").onclick = (e) => { e.stopPropagation(); editing = null; render(); };
    }
    hEl.appendChild(card);
  }
  const inp = document.getElementById("numInp");
  if (inp) setTimeout(() => inp.focus(), 60);

  // tiles
  let perfect = 0, streak = 0, totalSteps = 0, sleepSum = 0, sleepN = 0;
  for (let d = 1; d <= elapsed; d++) if (dayPerfect(PERSON, d)) perfect++;
  for (let d = elapsed; d >= 1; d--) { if (dayPerfect(PERSON, d)) streak++; else break; }
  for (let d = 1; d <= NDAYS; d++) {
    const sv = val(PERSON, d, "steps"); if (sv != null) totalSteps += sv;
    const sl = val(PERSON, d, "sleep"); if (sl != null) { sleepSum += sl; sleepN++; }
  }
  document.getElementById("tiles").innerHTML =
    '<div class="tile"><div class="tv">' + perfect + '</div><div class="tl">Perfect days</div></div>' +
    '<div class="tile"><div class="tv">' + streak + '</div><div class="tl">Streak</div></div>' +
    '<div class="tile"><div class="tv">' + (totalSteps >= 10000 ? (totalSteps/1000).toFixed(1) + '<small>k</small>' : fmt(totalSteps)) + '</div><div class="tl">Total steps</div></div>' +
    '<div class="tile"><div class="tv">' + (sleepN ? (sleepSum/sleepN).toFixed(1) + '<small>h</small>' : "—") + '</div><div class="tl">Avg sleep</div></div>';

  // trend charts
  const charts = document.getElementById("charts"); charts.innerHTML = "";
  const stepsDef = P.habits.find(h => h.type === "steps");
  const sleepDef = P.habits.find(h => h.type === "sleep");
  if (stepsDef) charts.appendChild(barChart("Steps", PERSON, stepsDef, t));
  if (sleepDef) charts.appendChild(sleepChart("Sleep", PERSON, sleepDef, t));

  // consistency grid
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  for (const h of P.habits) {
    const row = document.createElement("div"); row.className = "grow";
    let cells = "";
    for (let d = 1; d <= NDAYS; d++) {
      let cls = "gc";
      if (t >= 1 && t <= NDAYS && d > t) cls += " fut";
      else if (habitDone(PERSON, d, h)) cls += " on";
      else if (habitMissed(PERSON, d, h, t)) cls += " off";
      row.innerHTML = "";
      cells += '<span class="' + cls + '" title="' + h.name + ' · Aug ' + d + '"></span>';
    }
    row.innerHTML = '<div class="gname">' + h.name + '</div><div class="gcells">' + cells + '</div>';
    grid.appendChild(row);
  }

  // completion bars
  const hs = document.getElementById("hstats"); hs.innerHTML = "";
  const weeks = new Set(); for (let d = 1; d <= NDAYS; d++) weeks.add(weekOf(d));
  for (const h of P.habits) {
    let num = 0, den;
    if (isDaily(h)) { den = Math.max(elapsed, 1); for (let d = 1; d <= elapsed; d++) if (habitDone(PERSON, d, h)) num++; }
    else { den = 0;
      for (const w of weeks) { const days = weekDays(w);
        if (t >= days[0]) { den += h.target; num += Math.min(h.target, days.filter(d => habitDone(PERSON, d, h)).length); } }
      den = Math.max(den, 1); }
    const p = Math.round(num / den * 100);
    const el = document.createElement("div"); el.className = "hstat";
    el.innerHTML = '<div class="hn">' + h.name + '</div><div class="hb"><i style="width:' + p + '%"></i></div><div class="hv">' + num + "/" + den + '</div>';
    hs.appendChild(el);
  }
}

function barChart(title, p, h, t) {
  const card = document.createElement("div"); card.className = "chart-card";
  let max = h.target * 1.35, logged = 0, sum = 0;
  for (let d = 1; d <= NDAYS; d++) { const v = val(p, d, h.key); if (v != null) { max = Math.max(max, v * 1.05); logged++; sum += v; } }
  let bars = "";
  for (let d = 1; d <= NDAYS; d++) {
    const v = val(p, d, h.key);
    let cls = "b", hpx = 2;
    if (v != null) { hpx = Math.max(3, Math.round(v / max * 84)); cls += v >= stepsEff(p, d, h) ? " pass" : " fail"; }
    bars += '<div class="bcol"><div class="' + cls + '" style="height:' + hpx + 'px" title="Aug ' + d + ': ' + (v == null ? "—" : fmt(v)) + '"></div></div>';
  }
  const ty = Math.round(h.target / max * 84);
  card.innerHTML = '<div class="chart-top"><span class="ct">' + title + '</span><span class="cm">' +
    (logged ? "avg " + fmt(Math.round(sum / logged)) + " · " : "") + "target " + fmt(h.target) + '</span></div>' +
    '<div class="chart"><div class="tline" style="bottom:' + ty + 'px"></div><div class="bars">' + bars + '</div></div>' +
    '<div class="xaxis"><span>1</span><span>8</span><span>15</span><span>22</span><span>31</span></div>';
  return card;
}
function sleepChart(title, p, h, t) {
  const card = document.createElement("div"); card.className = "chart-card";
  const max = 11;
  let logged = 0, sum = 0, bars = "";
  for (let d = 1; d <= NDAYS; d++) {
    const v = val(p, d, h.key);
    let cls = "b", hpx = 2;
    if (v != null) { logged++; sum += v; hpx = Math.max(3, Math.round(Math.min(v, max) / max * 84)); cls += (v >= h.lo && v <= h.hi) ? " pass" : " fail"; }
    bars += '<div class="bcol"><div class="' + cls + '" style="height:' + hpx + 'px" title="Aug ' + d + ': ' + (v == null ? "—" : v + " h") + '"></div></div>';
  }
  const y1 = Math.round(h.lo / max * 84), y2 = Math.round(Math.min(h.hi, 8) / max * 84);
  card.innerHTML = '<div class="chart-top"><span class="ct">' + title + '</span><span class="cm">' +
    (logged ? "avg " + (sum / logged).toFixed(1) + " h · " : "") + 'target 6–8 h</span></div>' +
    '<div class="chart"><div class="tband" style="bottom:' + y1 + 'px; height:' + (y2 - y1) + 'px"></div><div class="bars">' + bars + '</div></div>' +
    '<div class="xaxis"><span>1</span><span>8</span><span>15</span><span>22</span><span>31</span></div>';
  return card;
}

selDay = clampDay(todayDay());
render();
pull();
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
window.addEventListener("online", flush);
setTimeout(() => {
  const sel = document.querySelector(".day.sel");
  if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}, 60);
</script>
</body>
</html>
